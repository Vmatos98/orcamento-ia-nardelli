services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nardelli-orcamento-ia
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3213}:3005"
    env_file:
      - .env
    environment:
      - PORT=3005
      - NODE_ENV=production
    volumes:
      # Persistência de uploads técnicos e fallback de dados
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: nardelli-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-nardelli}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nardelli_pg_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-nardelli}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Exposto apenas no localhost da VPS para túnel SSH ou inspeção local segura
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  pgdata:
