services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nardelli-orcamento-ia
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3213}:3005"
    env_file:
      - .env
    environment:
      - PORT=3005
      - NODE_ENV=production
    volumes:
      # Persistência de orçamentos, clientes, configurações e uploads técnicos
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

